interface:
  display_name: "IT 工单助手"
  short_description: "使用受控 MCP 工具查询员工资产并管理 IT 维修工单"
  default_prompt: "使用 $it-ticket-operations 处理这条员工 IT 报修请求。"

dependencies:
  tools:
    - type: "mcp"
      value: "itTicketService"
      description: "内部 IT 工单查询与写入 MCP 服务"
      transport: "streamable_http"
      url: "http://127.0.0.1:8000/mcp"

policy:
  allow_implicit_invocation: true

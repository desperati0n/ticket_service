services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ticket_service}
      MYSQL_USER: ${MYSQL_USER:-ticket_service}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql-migrate:
    image: mysql:8.4
    environment:
      MYSQL_PWD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_USER: ${MYSQL_USER:-ticket_service}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ticket_service}
    volumes:
      - ./mysql/migrate.sql:/migrations/migrate.sql:ro
    command:
      - sh
      - -c
      - until mysqladmin ping --host=mysql --user="$${MYSQL_USER}" --silent; do sleep 2; done; exec mysql --host=mysql --user="$${MYSQL_USER}" "$${MYSQL_DATABASE}" < /migrations/migrate.sql
    depends_on:
      mysql:
        condition: service_healthy

  mongo:
    image: mongo:8
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      OPENAPI_TITLE: ${OPENAPI_TITLE:-IT 运维助手 Demo API}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ticket_service}
      MYSQL_USER: ${MYSQL_USER:-ticket_service}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-ticket_service}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-conversation_logs}
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: ${REDIS_STREAM:-ticket_tasks}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-ticket_workers}
      CONVERSATION_SESSION_TTL_SECONDS: ${CONVERSATION_SESSION_TTL_SECONDS:-604800}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-deepseek}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    depends_on:
      mysql-migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python worker.py
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ticket_service}
      MYSQL_USER: ${MYSQL_USER:-ticket_service}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-ticket_service}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-conversation_logs}
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: ${REDIS_STREAM:-ticket_tasks}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-ticket_workers}
      REDIS_PENDING_IDLE_MS: ${REDIS_PENDING_IDLE_MS:-120000}
      REDIS_HEARTBEAT_INTERVAL_SECONDS: ${REDIS_HEARTBEAT_INTERVAL_SECONDS:-30}
      CONVERSATION_LOCK_TIMEOUT_SECONDS: ${CONVERSATION_LOCK_TIMEOUT_SECONDS:-120}
      CONVERSATION_LOCK_REFRESH_SECONDS: ${CONVERSATION_LOCK_REFRESH_SECONDS:-30}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-deepseek}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    depends_on:
      mysql-migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    scale: ${WORKER_REPLICAS:-4}

  adminer:
    image: adminer:4
    depends_on:
      - mysql
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

  mongo-express:
    image: mongo-express:1
    depends_on:
      - mongo
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_ENABLED: ${MONGO_EXPRESS_AUTH_ENABLED:-true}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-change-me}

volumes:
  mysql_data:
  mongo_data:
  redis_data:
